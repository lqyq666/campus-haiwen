services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: haiwen
      POSTGRES_PASSWORD: haiwen
      POSTGRES_USER: haiwen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haiwen -d haiwen"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - haiwen-postgres-data:/var/lib/postgresql/data

volumes:
  haiwen-postgres-data:
